[project]
name = "api-client"
version = "0.1.0"
description = "自研测试后端 (testbed) 与 API client 项目骨架"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "jmespath>=1.1.0",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
testbed = "testbed.__main__:main"
apic = "api_client_cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/testbed", "src/api_client", "src/api_client_cli"]

[tool.pytest.ini_options]
testpaths = ["tests/testbed", "tests/api_client", "tests/api_client_cli"]
timeout = 300  # 单条用例兜底上限 (防挂), pytest-timeout 强杀
