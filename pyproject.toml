[project]
name = "api-client"
version = "0.1.0"
description = "自研测试后端 (testbed) 与 API client 项目骨架"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testbed"]

[tool.pytest.ini_options]
testpaths = ["tests/testbed"]
