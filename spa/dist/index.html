  <!-- token 注入 (M3 D003/D004-4): __APIC_TOKEN_VALUE__ 由服务启动时内存内替换, 从不写盘.
       CSP script-src 'self' 拦截内联脚本, 故同时放 meta 标签; 外部 bundle 读 window.__APIC_TOKEN__,
       读不到再读 meta[apic-token] (两者必其一生效). 字面量行须保留 (后端 test_dist 断言). -->
  <meta name="apic-token" content="__APIC_TOKEN_VALUE__">
  <script>window.__APIC_TOKEN__ = "__APIC_TOKEN_VALUE__";</script>
